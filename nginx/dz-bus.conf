# DZ Bus Tracker — edge proxy in front of dz-api (http context).
#
# Mounted as /etc/nginx/templates/dz-bus.conf.template in the unprivileged nginx image, which
# renders it into /etc/nginx/conf.d/ at start-up. Only ${NGINX_*} variables are substituted
# (NGINX_ENVSUBST_FILTER=^NGINX_); every other $variable is nginx's own.
#
# nginx terminates TLS and HTTP/3 and speaks plain HTTP/1.1 to the API over a private network.
# It is the first hop, so it overwrites X-Forwarded-For with the peer address: clients cannot
# inject addresses, and the API trusts the header only from this proxy's subnet.
#
# Until certificates exist only the HTTP server is active; the TLS + HTTP/3 server is below,
# commented out (see docs/DEPLOYMENT.md, "TLS").

# Re-resolve the API service name so restarted or scaled replicas are picked up without a
# reload. NGINX_LOCAL_RESOLVERS is the container's DNS server (Docker or Podman/aardvark).
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 2s;

upstream dz_api {
    zone dz_api 64k;
    server api:8080 resolve max_fails=3 fail_timeout=5s;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# --- Abuse protection (coarse; the API enforces precise per-user/per-key GCRA quotas) -------------
limit_req_zone  $binary_remote_addr zone=dz_api_rps:20m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=dz_auth_rps:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=dz_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# WebSocket upgrade; plain requests keep the upstream connection alive.
map $http_upgrade $dz_connection {
    default upgrade;
    ''      '';
}

# --- Logging: JSON lines correlated with the API through the request id --------------------------
log_format dz_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","protocol":"$server_protocol",'
    '"user_agent":"$http_user_agent"}';

# --- Connection handling --------------------------------------------------------------------------
server_tokens off;
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
# keepalive_timeout (65 s) comes from the image's nginx.conf.
keepalive_requests 1000;
send_timeout 30s;
reset_timedout_connection on;

# The API compresses JSON itself (br, zstd, gzip by Accept-Encoding) and nginx passes encoded
# bodies through. gzip here only covers responses nginx generates. With the ngx_brotli module
# installed, `brotli on; brotli_types application/json application/problem+json;` can be added.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json application/problem+json text/plain text/css application/javascript;

# If a load balancer or CDN sits in front of nginx, trust its addresses here so $remote_addr is
# the real client (and adjust X-Forwarded-For handling accordingly):
# set_real_ip_from 203.0.113.0/24;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

server {
    # Add `listen [::]:8080 default_server;` when the container network has IPv6.
    listen 8080 default_server;
    server_name _;
    # Server-level, so it replaces the image's default access log instead of adding to it.
    access_log /dev/stdout dz_json;

    # ACME HTTP-01 challenges (certbot, lego, acme.sh... write into the acme-webroot volume).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Container health check (local only).
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Once TLS is enabled, replace the include below with a redirect:
    # location / { return 308 https://$host$request_uri; }
    include /etc/nginx/dz-bus/locations.conf;
}

