# Locations shared by the HTTP and HTTPS servers of nginx/dz-bus.conf.
# Mounted read-only at /etc/nginx/dz-bus/locations.conf.

# Real-time channel (WebSocket, milestone M3): long-lived, unbuffered, few per client.
location = /api/v1/ws {
    limit_conn dz_conn 10;
    proxy_pass http://dz_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dz_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    # The API pings every 25 s; idle sockets beyond this are dead.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

# Credential endpoints get a much lower per-IP rate before reaching the API.
location ~ ^/api/v1/auth/(login|register|refresh|password/reset) {
    limit_req zone=dz_auth_rps burst=10 nodelay;
    limit_conn dz_conn 20;
    proxy_pass http://dz_api;
    proxy_http_version 1.1;
    proxy_set_header Connection $dz_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
}

location /api/ {
    limit_req zone=dz_api_rps burst=60 nodelay;
    limit_conn dz_conn 50;
    proxy_pass http://dz_api;
    proxy_http_version 1.1;
    proxy_set_header Connection $dz_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
}

location = /.well-known/jwks.json {
    proxy_pass http://dz_api;
    proxy_http_version 1.1;
    proxy_set_header Connection $dz_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
}

# Health endpoints are for the orchestrator, not the internet (readiness details name
# internal dependencies).
location /health/ {
    return 404;
}

location / {
    return 404;
}

# nginx-generated errors use the API's problem format too.
error_page 429 = @dz_rate_limited;
error_page 502 503 504 = @dz_unavailable;

location @dz_rate_limited {
    default_type application/problem+json;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    return 429 '{"type":"urn:dzbus:problem:rate-limited","title":"Too Many Requests","status":429,"detail":"Too many requests; retry later.","code":"rate_limited","request_id":"$request_id"}';
}

location @dz_unavailable {
    default_type application/problem+json;
    add_header Retry-After 5 always;
    add_header Cache-Control no-store always;
    return 503 '{"type":"urn:dzbus:problem:service-unavailable","title":"Service Unavailable","status":503,"detail":"The service is temporarily unavailable.","code":"service_unavailable","request_id":"$request_id"}';
}
